name: CI

# Copy this folder into .github/workflows. Replace FULL_COMMIT_SHA with a
# released commit of vhco-pro/version-workflow and the checks job with the
# repository's own checks.
# Needs: RELEASE_APP_CLIENT_ID (variable), RELEASE_APP_PRIVATE_KEY (secret).
# The App's tag push starts the repository's tag-triggered release workflow.
#
# Runs on branch pushes, not pull_request: GitVersion needs the real branch,
# and a PR shows these push checks on its head commit. A private repository
# that runs CI only on PRs may use pull_request instead; those runs never tag.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "Replace with the repository's checks"

  # Tags the default branch, and a branch whose open PR has the release:preview
  # label at this commit. Every other run only calculates the version.
  version:
    needs: [checks]
    permissions:
      contents: read
      pull-requests: read
    uses: vhco-pro/version-workflow/.github/workflows/version.yml@FULL_COMMIT_SHA
    with:
      release-app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
