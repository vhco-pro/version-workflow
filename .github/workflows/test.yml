name: Test

on:
  workflow_call:

permissions: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool actionlint .github/workflows/*.yml examples/*/*.yml
      - run: go test -count=1 ./...

  # A pull_request run has GitHub's merge ref, never the default branch or a
  # labelled PR head, so the real gate runs and must decide not to tag. The
  # read-only token would also refuse the push.
  run:
    needs: contracts
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/version.yml
    with:
      dry-run: ${{ github.event_name != 'pull_request' }}
